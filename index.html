<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Council</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#070b12;
    --panel:#0d141f;
    --panel-edge:#1c2a3a;
    --holo:#4da6ff;
    --holo-bright:#6cc0ff;     /* the send button's blade */
    --holo-dim:#2a6db3;
    --parchment:#e8ecf2;
    --ash:#8a97a3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--stone);
    color:var(--parchment);
    font-family:'Cormorant Garamond',serif;
    font-size:19px;
    line-height:1.5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #rain-canvas{position:fixed;inset:0;z-index:0;opacity:.65}
  body::after{
    content:"";
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, transparent 30%, rgba(7,11,18,.75) 100%);
  }
  #gate,#room{position:relative;z-index:2}

  /* ---------- gate (off by default) ---------- */
  #gate{
    min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:2.2rem;padding:2rem;text-align:center;width:100%;
  }
  #gate .sigil{font-size:2rem;color:var(--ash);letter-spacing:.5em;text-indent:.5em;opacity:.85}
  #gate h1{
    font-family:'Cinzel',serif;font-weight:600;
    font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.28em;text-indent:.28em;
  }
  #gate p{color:var(--ash);font-style:italic;max-width:34ch}
  #gate form{display:flex;flex-direction:column;gap:1rem;align-items:center}
  #gate input{
    background:rgba(7,11,18,.6);border:none;border-bottom:1px solid var(--panel-edge);
    color:var(--parchment);font-family:'Cormorant Garamond',serif;font-size:1.3rem;
    text-align:center;letter-spacing:.15em;padding:.5rem 1rem;width:min(320px,80vw);
    outline:none;transition:border-color .4s;
  }
  #gate input:focus{border-bottom-color:var(--holo)}
  #gate button{
    background:rgba(7,11,18,.6);border:1px solid var(--holo-dim);color:var(--holo-bright);
    font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.3em;text-indent:.3em;
    padding:.8rem 2rem;cursor:pointer;transition:background .4s,color .4s;
  }
  #gate button:hover,#gate button:focus-visible{background:var(--holo-bright);color:var(--stone);outline:none}
  #gate .wrong{color:#a0522d;font-style:italic;min-height:1.5em}

  /* ---------- room ---------- */
  #room{
    display:none;flex-direction:column;align-items:center;
    width:min(760px,100%);min-height:100dvh;padding:2rem 1rem 1rem;
  }

  /* ---------- the stage: one keeper, front and center ---------- */
  #stage{
    position:relative;
    width:100%;
    display:flex;align-items:center;justify-content:center;
    padding:.2rem 0;
  }
  #viewport{
    position:relative;
    width:min(430px,84vw);
    overflow:hidden;
    touch-action:pan-y;
  }
  #track{
    display:flex;
    transition:transform .7s cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-reduced-motion:reduce){#track{transition:none}}
  .keeper{
    position:relative;
    flex:0 0 100%;
    text-align:center;
    overflow:hidden;          /* zoomed portraits and halos stay in their own slide */
  }
    .keeper .halo{
    position:absolute;inset:-10% -18% 22%;
    opacity:.6;
    pointer-events:none;
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:.75}}
  @media (prefers-reduced-motion:reduce){.keeper .halo{animation:none}}
  .keeper .frame{
    position:relative;
    height:clamp(280px,60vw,410px);        /* every keeper gets the same space */
    display:flex;align-items:flex-end;justify-content:center;
  }
  .keeper.banner .frame{align-items:flex-end;padding-bottom:2.9rem}  /* image rests right on the title */
  .keeper.banner .plate{bottom:2%}
  .keeper img{
    position:relative;
    max-width:100%;max-height:100%;
    width:auto;height:auto;display:block;
    object-fit:contain;
    transform-origin:50% 100%;
    /* oval + a bite out of each top corner */
    -webkit-mask-image:
      radial-gradient(ellipse 66% 74% at 50% 52%, black 58%, transparent 100%),
      radial-gradient(circle at 0% 0%, transparent 0%, transparent var(--bite-in,14%), black var(--bite-out,46%)),
      radial-gradient(circle at 100% 0%, transparent 0%, transparent var(--bite-in,14%), black var(--bite-out,46%));
    mask-image:
      radial-gradient(ellipse 66% 74% at 50% 52%, black 58%, transparent 100%),
      radial-gradient(circle at 0% 0%, transparent 0%, transparent var(--bite-in,14%), black var(--bite-out,46%)),
      radial-gradient(circle at 100% 0%, transparent 0%, transparent var(--bite-in,14%), black var(--bite-out,46%));
    -webkit-mask-composite:source-in;
    mask-composite:intersect;
  }
  .keeper .plate{
    position:absolute;
    left:0;right:0;bottom:2%;
    z-index:3;
    pointer-events:none;
  }
  .keeper .kname{
    font-family:'Cinzel',serif;font-weight:700;
    font-size:1.6rem;letter-spacing:.3em;text-indent:.3em;
    text-shadow:0 2px 14px rgba(7,11,18,1), 0 0 30px rgba(7,11,18,.9);
  }
  .keeper .krole{
    display:block;margin-top:.2rem;
    font-family:'Cinzel',serif;font-style:italic;
    font-size:.74rem;letter-spacing:.16em;
    color:#c3ced8;
    text-shadow:0 2px 10px rgba(7,11,18,1), 0 0 20px rgba(7,11,18,.9);
  }
  .arrow{
    position:absolute;top:38%;
    background:none;border:none;cursor:pointer;
    color:var(--ash);
    font-size:2rem;line-height:1;
    padding:.6rem .5rem;
    opacity:.5;
    transition:opacity .3s,color .3s;
    z-index:4;
  }
  .arrow:hover,.arrow:focus-visible{opacity:1;color:var(--parchment);outline:none}
  #prev{left:0}
  #next{right:0}
  #dots{
    display:flex;justify-content:center;gap:.55rem;
    margin-top:1.1rem;
    position:relative;z-index:4;
  }
  #dots button{
    width:7px;height:7px;padding:0;border-radius:50%;

    opacity:.35;cursor:pointer;
    transition:opacity .3s,background .3s;
  }

  /* ---------- chat ---------- */
  #scroll{
    width:100%;flex:1;overflow-y:auto;
    padding:.7rem .7rem 1rem;margin-top:1.1rem;

    background:rgba(7,11,18,.55);
    border:1px solid rgba(28,42,58,.6);

  }

  .msg .who{

    padding-bottom:.12rem;margin-bottom:.2rem;

  .msg.keeper-msg .who{border-bottom:none;filter:brightness(1.18) saturate(1.05)}

  }

  .msg.keeper-msg .text{border-left-color:inherit}
  .msg.pondering .text{color:var(--ash);font-style:italic}

  /* ---------- composer ---------- */
  #composer{

    padding:.9rem 0 1.2rem;margin-top:.8rem;
    border-top:1px solid var(--panel-edge);
  }

    background:rgba(13,20,31,.85);border:1px solid var(--panel-edge);
    color:var(--parchment);font-family:'Cormorant Garamond',serif;font-size:1.05rem;

  }
  #composer input:focus,#composer textarea:focus{border-color:var(--holo-dim)}
  #name{width:120px;flex-shrink:0}
  #message{flex:1;resize:none;height:48px;line-height:1.3}
  #send{
    background:rgba(13,20,31,.85);border:1px solid var(--holo-dim);color:var(--holo-bright);
    font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.2em;
    padding:0 1.2rem;cursor:pointer;border-radius:3px;transition:background .3s,color .3s;
  }

  #send:disabled{opacity:.4;cursor:default}
  #send:disabled:hover{background:rgba(13,20,31,.85);color:var(--holo-bright)}

    #viewport{width:min(390px,80vw)}
    .keeper .frame{height:clamp(260px,52vw,370px)}
    .keeper.banner .frame{padding-bottom:3.6rem}   /* a little more air above the title */
    #scroll{max-height:64dvh}
  }

  @media (max-width:480px){

    .msg .text{font-size:14.5px;line-height:1.45}
    .msg.keeper-msg .text{font-size:15px;padding-left:.7rem}
    .msg .who{font-size:.88rem}
    .keeper .kname{font-size:1.3rem;letter-spacing:.26em;text-indent:.26em}
    .keeper .krole{font-size:.66rem}

<body>

<canvas id="rain-canvas" aria-hidden="true"></canvas>

<!-- ══════════ THE GATE (enabled via REQUIRE_PASSWORD) ══════════ -->
<section id="gate">
  <div class="sigil">✦ ✦ ✦</div>
  <h1>THE COUNCIL</h1>
  <p>Beyond this door sit those who have pondered long. Speak the word, and enter.</p>
  <form id="gateForm">
    <input id="password" type="password" inputmode="numeric" placeholder="the word" autocomplete="off" aria-label="Password">
    <button type="submit">ENTER THE COUNCIL</button>
    <div class="wrong" id="wrong" aria-live="polite"></div>
  </form>
</section>

<!-- ══════════ THE ROOM ══════════ -->
<section id="room">
  <div id="stage">
    <button class="arrow" id="prev" aria-label="Previous keeper">‹</button>
    <div id="viewport"><div id="track"></div></div>
    <button class="arrow" id="next" aria-label="Next keeper">›</button>
  </div>
  <div id="dots"></div>

  <div id="scroll" aria-live="polite"></div>

  <form id="composer">
    <input id="name" type="text" placeholder="Your name" maxlength="24" aria-label="Your name">
    <textarea id="message" placeholder="Speak to the Council…" maxlength="1000" aria-label="Message"></textarea>
    <button id="send" type="submit">SEND</button>
  </form>
</section>

<!-- ══════════ ANCIENT RAIN ══════════ -->
<script>
(function(){
  var rc = document.getElementById('rain-canvas');
  var rctx = rc.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var fontSize = 16;
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*+-=[]{}|;:<>?/!～！￥（）【】';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var BLUES = ['77,166,255', '98,184,255', '47,127,229', '150,205,255'];
  var WHITE = '235,242,248';
  var BLUE_GLOW = 'rgba(77,166,255,0.5)';

  var columns = 0, drops = [];

  function setup(){
    rc.width = window.innerWidth * dpr;
    rc.height = window.innerHeight * dpr;
    rc.style.width = window.innerWidth + 'px';
    rc.style.height = window.innerHeight + 'px';
    rctx.setTransform(1,0,0,1,0,0);
    rctx.scale(dpr, dpr);
    rctx.fillStyle = '#070b12';
    rctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    columns = Math.floor(window.innerWidth / fontSize);
    drops = [];
    for (var i = 0; i < columns; i++){
      drops.push({
        y: Math.random() * window.innerHeight / fontSize,
        color: BLUES[Math.floor(Math.random() * BLUES.length)],
        speed: 0.35 + Math.random() * 0.5
      });
    }
    if (reduced) drawFrozen();
  }

  function drawFrozen(){
    rctx.font = fontSize + 'px monospace';
    rctx.shadowColor = BLUE_GLOW;
    rctx.shadowBlur = 6;
    for (var i = 0; i < columns; i++){
      var x = i * fontSize;
      var start = Math.random() * window.innerHeight;
      var len = 10 + Math.floor(Math.random() * 30);
      for (var j = 0; j < len; j++){
        var y = start + j * fontSize;
        if (y < 0 || y > window.innerHeight) continue;
        var ch = chars.charAt(Math.floor(Math.random() * chars.length));
        var fade = 1 - (j / len);
        var col = (ch >= '0' && ch <= '9') ? WHITE : drops[i].color;
        rctx.fillStyle = 'rgba(' + col + ',' + (0.2 + fade * 0.55) + ')';
        rctx.fillText(ch, x, y);
      }
    }
    rctx.shadowBlur = 0;
  }

  var last = 0;
  function tick(t){
    if (t - last > 66){
      last = t;
      rctx.fillStyle = 'rgba(7,11,18,0.045)';
      rctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      rctx.font = fontSize + 'px monospace';
      rctx.shadowColor = BLUE_GLOW;
      rctx.shadowBlur = 6;
      for (var i = 0; i < columns; i++){
        var d = drops[i];
        var ch = chars.charAt(Math.floor(Math.random() * chars.length));
        var x = i * fontSize;
        var y = d.y * fontSize;
        if (ch >= '0' && ch <= '9'){
          rctx.fillStyle = 'rgba(' + WHITE + ',0.95)';
        } else {
          rctx.fillStyle = 'rgba(' + d.color + ',0.92)';
        }
        rctx.fillText(ch, x, y);
        d.y += d.speed;
        if (y > window.innerHeight && Math.random() > 0.955){ d.y = 0; }
      }
      rctx.shadowBlur = 0;
    }
    requestAnimationFrame(tick);
  }

  setup();
  window.addEventListener('resize', setup);
  if (!reduced) requestAnimationFrame(tick);
})();
</script>

async function loadFirebase() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ---------- build the stage ---------- */
const track = document.getElementById("track");
const dots = document.getElementById("dots");
let current = 0;

function buildStage() {
  track.innerHTML = "";
  dots.innerHTML = "";
  KEEPERS.forEach((k, i) => {
    const el = document.createElement("div");
    el.className = "keeper" + (k.banner ? " banner" : "");
    el.id = "keeper-" + k.key;
    el.innerHTML =
      `<div class="halo" style="background:radial-gradient(ellipse 55% 55% at 50% 45%, ${k.color}1c, ${k.color}0a 45%, transparent 72%)"></div>
       <div class="frame">
         <img src="${k.img}" alt="${k.display}" style="transform:scale(${k.zoom || 1});opacity:${k.opacity || 1};--bite-in:${k.biteIn || 14}%;--bite-out:${k.biteOut || 46}%">

           ${k.role ? `<span class="krole">${k.role}</span>` : ""}
         </div>
       </div>`;
    track.appendChild(el);

    const dot = document.createElement("button");
    dot.style.color = k.color;
    dot.setAttribute("aria-label", k.name);
    dot.addEventListener("click", () => goTo(i));
    dots.appendChild(dot);
  });
  goTo(0);
}

function goTo(i) {
  current = (i + KEEPERS.length) % KEEPERS.length;
  track.style.transform = `translateX(-${current * 100}%)`;
  [...dots.children].forEach((d, n) => d.classList.toggle("on", n === current));
}
let stageLocked = true;          // history loading — stay on the council portrait
function stepForward(key) {
  if (stageLocked) return;
  const i = KEEPERS.findIndex(k => k.key === key);
  if (i !== -1) goTo(i);
}

document.getElementById("next").addEventListener("click", () => goTo(current + 1));

let touchX = null;
viewport.addEventListener("touchstart", e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
viewport.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) goTo(current + (dx < 0 ? 1 : -1));
  touchX = null;
}, { passive: true });

// arrow keys
document.addEventListener("keydown", e => {
  if (document.activeElement === msgEl || document.activeElement === nameEl) return;
  if (e.key === "ArrowLeft") goTo(current - 1);
  if (e.key === "ArrowRight") goTo(current + 1);
});

/* ---------- gate ---------- */
if (!REQUIRE_PASSWORD || sessionStorage.getItem("council") === "open") {
  enterCouncil();
} else {
  gate.style.display = "flex";
}

document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (document.getElementById("password").value.trim() !== COUNCIL_PASSWORD) {
    wrong.textContent = "The door does not move.";
    return;
  }
  sessionStorage.setItem("council", "open");
  await enterCouncil();
});

async function enterCouncil() {
  gate.style.display = "none";
  room.style.display = "flex";
  buildStage();
  nameEl.value = localStorage.getItem("councilName") || "";

  // load every soul
  await Promise.all(KEEPERS.filter(k => !k.external && !k.banner).map(async k => {
    try {
      const r = await fetch(k.md);
      souls[k.key] = r.ok ? await r.text() : `You are ${k.name}.`;
    } catch { souls[k.key] = `You are ${k.name}.`; }
  }));

  if (firebaseConfig.apiKey.startsWith("YOUR_")) {
    previewMode = true;
    renderMessage({ from: "human", name: "Anon", text: "Qui-Gon, Xaximus — I keep waiting for the right time to start." });
    renderMessage({ from: "quigon", text: "The right time is a story the fearful tell themselves, Anon. The flint is already in your hand. Strike it tonight." });
    renderMessage({ from: "xaximus", text: "He is right, though I would put it plainer: waiting is a decision you are already making, and it is the expensive one. Pick the smallest piece and ship it before you sleep." });
    renderMessage({ from: "mario", text: "Both of them are right, and both of them are slow. Pick the pipe, jump in, find out where it goes." });
    renderMessage({ from: "samwise", text: "Beggin' your pardon — but you don't grow a garden by staring at the dirt. One seed today, Anon. That's all it takes to start." });
    renderMessage({ from: "human", name: "Nexie", text: "Reading the room: four voices, one conclusion. The pattern is clear. Move." });
    renderMessage({ from: "human", name: "Anon", text: "(preview mode — add your Firebase config and worker URL to bring the chamber to life)" });
    setTimeout(() => { stageLocked = false; }, 1500);
    return;
  }

  try {
    await loadFirebase();
  } catch (err) {
    renderMessage({ from: "human", name: "—", text: "The chamber cannot reach the archive. Refresh, or check the connection." });
    console.error(err); return;
  }

  const app = fb.initializeApp(firebaseConfig);
  await fb.signInAnonymously(fb.getAuth(app));
  db = fb.getDatabase(app);

  const messagesRef = fb.query(fb.ref(db, "council/messages"), fb.limitToLast(DISPLAY_LIMIT));
  fb.onChildAdded(messagesRef, (snap) => absorb(snap.key, snap.val()));
  setTimeout(() => { stageLocked = false; }, 1500);   // past history won't move the stage; new words will
}

/* ---------- messages ---------- */
function absorb(key, m) {
  if (!m || !m.text || seen.has(key)) return;
  seen.add(key);
  log.push(m);
  if (log.length > 120) log.shift();
  renderMessage(m);
  const k = claimedKeeper(m);
  if (k) stepForward(k.key);
}

function claimedKeeper(m) {
  if (byKey[m.from]) return byKey[m.from];
  const n = (m.name || "").trim().toLowerCase();
  if (!n) return null;
  return KEEPERS.find(k => k.external && !k.banner &&
    (k.name.toLowerCase() === n || k.aliases.includes(n))) || null;
}

function renderMessage(m) {
  const k = claimedKeeper(m);
  const div = document.createElement("div");
  div.className = "msg" + (k ? " keeper-msg" : "");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = k ? k.name : (m.name || "Anon");
  if (k) {
    who.style.color = k.color;
    who.style.textShadow = `0 0 14px ${k.color}59`;
  }
  const text = document.createElement("div");
  text.className = "text";
  if (k) text.style.borderLeftColor = k.color;
  text.textContent = (k && k.verse)
    ? m.text.replace(/([.!?\u2026])\s+/g, "$1\n")
    : m.text;
  div.append(who, text);
  scroll.appendChild(div);
  while (scroll.children.length > DISPLAY_LIMIT) scroll.removeChild(scroll.firstChild);
  scroll.scrollTop = scroll.scrollHeight;
}

function showPondering(k) {
  clearPondering();
  const div = document.createElement("div");
  div.className = "msg keeper-msg pondering";
  div.id = "pondering";
  div.innerHTML = `<div class="who" style="color:${k.color}">${k.name}</div><div class="text" style="border-left-color:${k.color}">pondering…</div>`;
  scroll.appendChild(div);
  scroll.scrollTop = scroll.scrollHeight;
}
function clearPondering(){ document.getElementById("pondering")?.remove(); }

/* ---------- who was summoned, and in what order ---------- */
function summonedBy(text) {
  const lower = text.toLowerCase();
  const found = [];
  for (const k of KEEPERS) {
    if (k.external || k.banner) continue;  // her own bot answers for her; the banner never speaks
    let first = -1;
    for (const a of k.aliases) {
      const re = new RegExp("\\b" + a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
      const m = lower.match(re);
      if (m && (first === -1 || m.index < first)) first = m.index;
    }
    if (first !== -1) found.push({ keeper: k, at: first });
  }
  return found.sort((a, b) => a.at - b.at).map(f => f.keeper);   // first named speaks first
}

/* ---------- history handed to a keeper ---------- */
function historyFor(key) {
  const recent = log.slice(-MEMORY_LIMIT).map(m => {
    if (m.from === key) return { role: "assistant", content: m.text };
    const who = byKey[m.from] ? byKey[m.from].name : (m.name || "Anon");
    return { role: "user", content: `${who}: ${m.text}` };
  });
  while (recent.length && recent[0].role !== "user") recent.shift();
  return recent;
}

/* ---------- send ---------- */
document.getElementById("composer").addEventListener("submit", sendMessage);
msgEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(e); }
});

async function sendMessage(e) {
  e.preventDefault();
  const name = nameEl.value.trim() || "Anon";
  const text = msgEl.value.trim();
  if (!text) return;

  if (previewMode) {
    renderMessage({ from: "human", name, text });
    renderMessage({ from: "human", name: "—", text: "The chamber is not yet awake — connect Firebase and the worker." });
    msgEl.value = ""; return;
  }
  if (!db) return;

  localStorage.setItem("councilName", name);
  msgEl.value = "";
  sendBtn.disabled = true;

  try {
    await post({ from: "human", name, text });

    // who answers: those named — or, if no one is named, whoever just spoke (one time)
    let queue = summonedBy(text);
    if (queue.length === 0 && FOLLOW_UP !== "off") {
      queue = followUp.slice();          // they get one reply without being called
    }
    followUp = [];                        // the debt is settled either way
    const spoken = new Set();
    const order = [];
    let replies = 0;

    while (queue.length && replies < MAX_REPLIES) {
      const k = queue.shift();
      if (spoken.has(k.key)) continue;      // one turn each per message
      spoken.add(k.key);

      stepForward(k.key);
      showPondering(k);
      let reply = "";
      try { reply = await ask(k); } catch (err) { console.error(err); }
      clearPondering();
      if (!reply) continue;

      await post({ from: k.key, name: k.name, text: reply });
      replies++;

      // a keeper may call on another keeper by name
      if (KEEPERS_ANSWER_EACH_OTHER) {
        for (const other of summonedBy(reply)) {
          if (other.key !== k.key && !spoken.has(other.key)) queue.push(other);
        }
      }
      order.push(k);
    }

    // whoever spoke may answer one more message unprompted
    if (FOLLOW_UP === "last") followUp = order.slice(-1);
    else if (FOLLOW_UP === "all") followUp = order;

    trimCouncil();
  } catch (err) {
    clearPondering();
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    msgEl.focus();
  }
}

async function post(m) {
  const r = await fb.push(fb.ref(db, "council/messages"), { ...m, at: fb.serverTimestamp() });
  absorb(r.key, m);        // show it now; onChildAdded will dedupe
}

async function ask(k) {
  const res = await fetch(AGENT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: souls[k.key], messages: historyFor(k.key) })
  });
  if (!res.ok) throw new Error("Agent endpoint returned " + res.status);
  const data = await res.json();
  return data.reply || "";
}

/* ---------- the archive keeps only 99 ---------- */
async function trimCouncil() {
  try {
    const snap = await fb.get(fb.query(fb.ref(db, "council/messages"), fb.orderByKey()));
    if (!snap.exists()) return;
    const keys = Object.keys(snap.val()).sort();
    const excess = keys.length - MAX_MESSAGES;
    if (excess <= 0) return;
    const updates = {};
    keys.slice(0, excess).forEach(key => { updates[key] = null; });
    await fb.update(fb.ref(db, "council/messages"), updates);
  } catch (err) { console.error("trim failed", err); }
}
